[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "incident-copilot"
version = "0.1.0"
description = "Cheap anomaly detection on logs with LLM-powered root-cause analysis."
readme = "README.md"
requires-python = ">=3.11,<4"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",

    # Database
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",        # psycopg3 – the driver spec requires
    "alembic>=1.13,<2",

    # Log parsing
    "drain3>=0.9.11",

    # Online ML
    "river>=0.21,<1",

    # System metrics (used in feature vectors)
    "psutil>=5.9,<7",

    # CLI
    "typer>=0.12,<1",
    "rich>=13,<14",           # pretty CLI output (was bundled in typer[all])

    # Config
    "python-dotenv>=1.0,<2",

    # HTTP client (agent tool calls)
    "httpx>=0.27,<1",

    # LLM SDK (imported only when a Gemini call is attempted)
    "google-genai>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",          # async test client
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-psutil",
]
anthropic = [
    "anthropic>=0.28,<1",
]

[project.scripts]
incident-copilot = "cli.main:app"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths   = ["tests"]
asyncio_mode = "auto"
addopts     = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*", "testbed*", "eval*"]
